name: Auto Merge & Deploy Claude Branches

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
    inputs:
      deploy_flutter:
        description: 'Flutter (Firebase Hosting) をデプロイ'
        type: boolean
        default: true
      deploy_functions:
        description: 'Cloud Functions をデプロイ'
        type: boolean
        default: false
      deploy_firestore:
        description: 'Firestore rules/indexes をデプロイ'
        type: boolean
        default: false
      deploy_pc_site:
        description: 'Next.js (pc-site) をデプロイ'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect changed files
        id: detect
        run: |
          # 手動トリガーの場合はinputsから判定
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "flutter=${{ inputs.deploy_flutter }}" >> $GITHUB_OUTPUT
            echo "functions=${{ inputs.deploy_functions }}" >> $GITHUB_OUTPUT
            echo "firestore=${{ inputs.deploy_firestore }}" >> $GITHUB_OUTPUT
            echo "pc_site=${{ inputs.deploy_pc_site }}" >> $GITHUB_OUTPUT
            echo "Manual dispatch: flutter=${{ inputs.deploy_flutter }}, functions=${{ inputs.deploy_functions }}, firestore=${{ inputs.deploy_firestore }}, pc_site=${{ inputs.deploy_pc_site }}"
            exit 0
          fi

          git fetch origin main
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q '^pc-site/'; then
            echo "pc_site=true" >> $GITHUB_OUTPUT
          else
            echo "pc_site=false" >> $GITHUB_OUTPUT
          fi

          # Flutter = pc-site/、.github/、firestore.*、storage.rules、functions/ 以外のファイルが変更された場合
          if echo "$CHANGED" | grep -qvE '^(pc-site/|\.github/|functions/|firestore\.|storage\.rules)'; then
            echo "flutter=true" >> $GITHUB_OUTPUT
          else
            echo "flutter=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q '^functions/'; then
            echo "functions=true" >> $GITHUB_OUTPUT
          else
            echo "functions=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^firestore\.(rules|indexes\.json)$'; then
            echo "firestore=true" >> $GITHUB_OUTPUT
          else
            echo "firestore=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge main into branch
        if: github.event_name != 'workflow_dispatch'
        run: |
          git merge origin/main --no-edit
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Create PR and merge
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          # 既存のオープンPRを確認
          EXISTING=$(gh pr list --head "${BRANCH}" --base main --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already exists, merging..."
            gh pr merge "${EXISTING}" --merge
          else
            echo "Creating new PR from ${BRANCH}..."
            PR_URL=$(gh pr create \
              --title "Auto merge: ${BRANCH}" \
              --body "Auto-merged by CI from \`${BRANCH}\`" \
              --base main \
              --head "${BRANCH}")
            echo "Created: ${PR_URL}"

            sleep 3

            gh pr merge "${PR_URL}" --merge
            echo "Merged successfully"
          fi

      - name: Checkout main after merge
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch origin main
          git checkout origin/main

      # ========== Flutter ビルド & デプロイ ==========
      - name: Setup Flutter
        if: steps.detect.outputs.flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Flutter - Install dependencies
        if: steps.detect.outputs.flutter == 'true'
        run: flutter pub get

      - name: Flutter - Build web
        if: steps.detect.outputs.flutter == 'true'
        run: flutter build web --release

      - name: Flutter - Copy website files
        if: steps.detect.outputs.flutter == 'true'
        run: |
          mkdir -p build/web/lp
          cp website/index.html build/web/lp/
          cp website/terms.html build/web/
          cp website/privacy.html build/web/
          cp website/contact.html build/web/
          cp website/404.html build/web/
          cp website/invite.html build/web/
          cp website/design.html build/web/
          mkdir -p build/web/invite
          cp website/invite.html build/web/invite/index.html

      - name: Flutter - Deploy to Firebase Hosting
        if: steps.detect.outputs.flutter == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: sofvo-19d84

      # ========== Next.js (pc-site) ビルド & デプロイ ==========
      - name: Setup Node.js
        if: steps.detect.outputs.pc_site == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pc-site/package-lock.json

      - name: Next.js - Install dependencies
        if: steps.detect.outputs.pc_site == 'true'
        run: npm ci
        working-directory: pc-site

      - name: Next.js - Build
        if: steps.detect.outputs.pc_site == 'true'
        run: npm run build
        working-directory: pc-site

      # ========== Cloud Functions デプロイ ==========
      - name: Functions - Setup Node.js
        if: steps.detect.outputs.functions == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Functions - Install dependencies
        if: steps.detect.outputs.functions == 'true'
        run: cd functions && npm install

      - name: Functions - Create .env from secrets
        if: steps.detect.outputs.functions == 'true'
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "AMAZON_ACCESS_KEY=${AMAZON_ACCESS_KEY}" > functions/.env
          echo "AMAZON_SECRET_KEY=${AMAZON_SECRET_KEY}" >> functions/.env
          echo "AMAZON_PARTNER_TAG=${AMAZON_PARTNER_TAG}" >> functions/.env
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> functions/.env

      - name: Functions - Authenticate to Google Cloud
        if: steps.detect.outputs.functions == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Functions - Deploy Cloud Functions
        if: steps.detect.outputs.functions == 'true'
        run: |
          for i in 1 2 3; do
            echo "Deploy attempt $i..."
            npx firebase-tools deploy --only functions --project sofvo-19d84 --force && exit 0
            echo "Attempt $i failed, retrying in ${i}0s..."
            sleep $((i * 10))
          done
          echo "All deploy attempts failed"
          exit 1

      # Firestore ルール & インデックスは firebase-deploy.yml (main push) でデプロイ
