name: Build Android AAB

on:
  workflow_dispatch:
    inputs:
      deploy_to_play_store:
        description: 'Google Play 製品版にアップロード'
        type: boolean
        default: false
  push:
    branches: [main, claude/*]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/sofvo-release-key.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=sofvo
          storeFile=sofvo-release-key.jks
          EOF

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # ── Google Play 製品版へ自動アップロード ──
      - name: Setup Ruby
        if: github.ref == 'refs/heads/main' && inputs.deploy_to_play_store == true
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install Fastlane
        if: github.ref == 'refs/heads/main' && inputs.deploy_to_play_store == true
        run: gem install fastlane

      - name: Create Google Play service account key
        if: github.ref == 'refs/heads/main' && inputs.deploy_to_play_store == true
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > android/fastlane/google-play-key.json

      - name: Deploy to Google Play (production)
        if: github.ref == 'refs/heads/main' && inputs.deploy_to_play_store == true
        working-directory: android
        run: fastlane release
        env:
          SUPPLY_JSON_KEY: fastlane/google-play-key.json

      - name: Cleanup service account key
        if: always() && inputs.deploy_to_play_store == true
        run: rm -f android/fastlane/google-play-key.json
