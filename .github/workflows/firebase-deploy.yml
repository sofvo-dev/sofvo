name: Deploy to Firebase (Hosting + Functions + Firestore + Storage)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: cd functions && npm ci

      - name: Create Functions .env
        run: |
          echo "AMAZON_ACCESS_KEY=${{ secrets.AMAZON_ACCESS_KEY }}" > functions/.env
          echo "AMAZON_SECRET_KEY=${{ secrets.AMAZON_SECRET_KEY }}" >> functions/.env
          echo "AMAZON_PARTNER_TAG=${{ secrets.AMAZON_PARTNER_TAG }}" >> functions/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> functions/.env

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcloud-sa.json

      - name: Deploy Functions
        run: firebase deploy --only functions --project sofvo-19d84 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-sa.json

      - name: Deploy Firestore rules & indexes
        run: firebase deploy --only firestore --project sofvo-19d84 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-sa.json

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project sofvo-19d84 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-sa.json

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcloud-sa.json

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Copy website files (LP, terms, privacy, invite, etc.)
        run: |
          mkdir -p build/web/lp
          cp website/index.html build/web/lp/
          cp website/start.html build/web/
          cp website/terms.html build/web/
          cp website/privacy.html build/web/
          cp website/contact.html build/web/
          cp website/404.html build/web/
          cp website/invite.html build/web/
          cp website/design.html build/web/
          cp -r website/images build/web/images
          mkdir -p build/web/invite
          cp website/invite.html build/web/invite/index.html

      - name: Copy App Links / Universal Links (.well-known)
        run: |
          mkdir -p build/web/.well-known
          cp website/.well-known/apple-app-site-association build/web/.well-known/
          python3 <<'PY'
          import json, os
          with open("website/.well-known/assetlinks.json") as f:
              data = json.load(f)
          extra = os.environ.get("PLAY_APP_SIGNING_SHA256", "").strip()
          if extra:
              parts = [x.strip() for x in extra.replace(",", " ").split() if x.strip()]
              data[0]["target"]["sha256_cert_fingerprints"] = parts
          with open("build/web/.well-known/assetlinks.json", "w") as f:
              json.dump(data, f, separators=(",", ":"))
          PY
        env:
          PLAY_APP_SIGNING_SHA256: ${{ secrets.PLAY_APP_SIGNING_SHA256 }}

      - name: Setup Node.js (pc-site)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pc-site/package-lock.json

      - name: pc-site - Install dependencies
        run: npm ci
        working-directory: pc-site

      - name: pc-site - Build (static export)
        run: npm run build
        working-directory: pc-site

      - name: Merge pc-site into build/web/pc
        run: |
          rm -rf build/web/pc
          mkdir -p build/web/pc
          cp -r pc-site/out/. build/web/pc/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: sofvo-19d84
