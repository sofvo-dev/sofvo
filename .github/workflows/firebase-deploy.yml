name: Deploy to Firebase (Hosting + Functions + Firestore + Storage)

on:
  push:
    branches: [main]

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: cd functions && npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/gcloud-sa.json

      - name: Deploy Functions
        run: firebase deploy --only functions --project sofvo-19d84 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-sa.json

      - name: Deploy Firestore rules & indexes
        run: firebase deploy --only firestore --project sofvo-19d84 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-sa.json

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project sofvo-19d84 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-sa.json

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcloud-sa.json

  update-app-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Update Firestore config/app latestVersion
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "Updating latestVersion to $VERSION"
          TOKEN=$(gcloud auth print-access-token)
          curl -s -X PATCH \
            "https://firestore.googleapis.com/v1/projects/sofvo-19d84/databases/(default)/documents/config/app?updateMask.fieldPaths=latestVersion" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"fields\":{\"latestVersion\":{\"stringValue\":\"$VERSION\"}}}"
          echo ""
          echo "Updated config/app latestVersion to $VERSION"

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Copy website files (LP, terms, privacy, invite, etc.)
        run: |
          mkdir -p build/web/lp
          cp website/index.html build/web/lp/
          cp website/terms.html build/web/
          cp website/privacy.html build/web/
          cp website/contact.html build/web/
          cp website/404.html build/web/
          cp website/invite.html build/web/
          cp website/design.html build/web/
          cp -r website/images build/web/images
          mkdir -p build/web/invite
          cp website/invite.html build/web/invite/index.html

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: sofvo-19d84
