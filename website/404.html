<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません - Sofvo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1B3A5C;
      --primary-dark: #0F2440;
      --primary-light: #2E5C8A;
      --accent: #C4A962;
      --bg: #F7F7F7;
      --text: #1A1A1A;
      --text-secondary: #6B6B6B;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 480px; }
    h1 { font-size: 80px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    p { color: var(--text-secondary); margin-bottom: 32px; line-height: 1.7; }
    a {
      display: inline-block;
      background: var(--primary);
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.2s;
    }
    a:hover {
      background: var(--primary-dark);
      box-shadow: 0 4px 12px rgba(27,58,92,0.3);
      transform: translateY(-2px);
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 32px;
    }
    .logo em { color: var(--accent); font-style: normal; }
    .accent-line {
      width: 48px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
      margin: 0 auto 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Sof<em>vo</em></div>
    <div class="accent-line"></div>
    <h1>404</h1>
    <h2>ページが見つかりません</h2>
    <p>お探しのページは存在しないか、移動した可能性があります。</p>
    <a href="/">トップページへ戻る</a>
  </div>
</body>
</html>
