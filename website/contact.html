<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ - Sofvo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1B3A5C;
      --primary-light: #2E5C8A;
      --primary-dark: #0F2440;
      --accent: #C4A962;
      --accent-light: #D4C08A;
      --bg: #F7F7F7;
      --surface: #FFFFFF;
      --text: #1A1A1A;
      --text-secondary: #6B6B6B;
      --text-hint: #B0B0B0;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif;
      color: var(--text);
      line-height: 1.8;
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding: 14px 24px;
    }
    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
    }
    .logo span { color: var(--accent); }
    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--primary); }
    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      text-align: center;
      color: var(--primary);
    }
    .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      text-align: center;
      margin-bottom: 32px;
    }
    .form-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.06);
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      background: var(--bg);
      transition: border 0.2s;
      color: var(--text);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    textarea { resize: vertical; min-height: 140px; }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .submit-btn:hover {
      background: var(--primary-dark);
      box-shadow: 0 4px 12px rgba(27,58,92,0.3);
    }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-hint);
      text-align: center;
    }
    .faq-link { text-align: center; margin-top: 24px; }
    .faq-link p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .faq-link a {
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .faq-link a:hover { color: var(--primary-light); }
    .footer {
      padding: 40px 24px;
      text-align: center;
      border-top: 1px solid rgba(0,0,0,0.06);
      margin-top: 20px;
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 12px;
    }
    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--primary); }
    .footer-copy {
      font-size: 12px;
      color: var(--text-hint);
    }
    @media (max-width: 768px) {
      main { padding: 32px 16px 60px; }
      .form-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">Sof<span>vo</span></a>
      <a href="index.html" class="back-link">トップに戻る</a>
    </div>
  </div>

  <main>
    <h1>お問い合わせ</h1>
    <p class="subtitle">ご質問やご要望がありましたら、お気軽にお問い合わせください。</p>

    <div class="form-card">
      <form id="contactForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" required placeholder="山田 太郎">
        </div>
        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label for="category">カテゴリ</label>
          <select id="category" name="category" required>
            <option value="">選択してください</option>
            <option value="bug">不具合の報告</option>
            <option value="feature">機能のリクエスト</option>
            <option value="account">アカウントについて</option>
            <option value="tournament">大会運営について</option>
            <option value="privacy">個人情報について</option>
            <option value="other">その他</option>
          </select>
        </div>
        <div class="form-group">
          <label for="message">お問い合わせ内容</label>
          <textarea id="message" name="message" required placeholder="お問い合わせ内容をご記入ください"></textarea>
        </div>
        <button type="submit" class="submit-btn">送信する</button>
      </form>
      <p class="note">通常2〜3営業日以内にご返信いたします。</p>
    </div>

    <div class="faq-link">
      <p>お問い合わせの前に</p>
      <a href="index.html#faq">よくある質問を確認する</a>
    </div>
  </main>

  <div class="footer">
    <div class="footer-links">
      <a href="index.html">トップページ</a>
      <a href="terms.html">利用規約</a>
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="contact.html">お問い合わせ</a>
    </div>
    <div class="footer-copy">&copy; 2025 Sofvo. All rights reserved.</div>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      var form = document.getElementById('contactForm');
      form.innerHTML = '<div style="text-align:center;padding:40px 0;">' +
        '<div style="font-size:48px;margin-bottom:16px;">&#9989;</div>' +
        '<h3 style="font-size:20px;margin-bottom:8px;color:#1B3A5C;">送信完了しました</h3>' +
        '<p style="color:#6B6B6B;font-size:14px;">お問い合わせありがとうございます。<br>内容を確認の上、ご返信いたします。</p>' +
        '</div>';
    }
  </script>
</body>
</html>
